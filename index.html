<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>طريقة نيوتن–رافسون</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#ffffff; --surface:#f3f4f6; --ink:#15171a; --muted:#5d636d; --rule:#c9ccd2;
  --accent:#c8201b; --accent-ink:#ffffff;
  --sans:"IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;
  --serif:"Times New Roman",Cambria,"Noto Serif",serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#121417; --surface:#1c1f24; --ink:#ecebe8; --muted:#9aa0a9; --rule:#363b43;
    --accent:#ff6b63; --accent-ink:#1a0a09;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#121417; --surface:#1c1f24; --ink:#ecebe8; --muted:#9aa0a9; --rule:#363b43;
  --accent:#ff6b63; --accent-ink:#1a0a09;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.7 var(--sans)}
main{max-width:860px;margin:0 auto;padding:1.5rem 1.1rem 3rem}

h1{font:700 2rem/1.25 var(--serif);color:var(--accent);margin:.4rem 0 .3rem}
h1 .en{display:block;direction:ltr;text-align:right;font:italic 400 1.05rem var(--serif);color:var(--muted)}
.lead{color:var(--muted);max-width:62ch;margin:0 0 1.4rem}

.formula{
  direction:ltr;width:fit-content;max-width:100%;
  display:flex;align-items:center;flex-wrap:wrap;gap:.35rem;
  border:1.5px solid var(--ink);padding:.8rem 1.3rem;
  font:italic 1.45rem var(--serif);
}
.formula sub{font-size:.62em;line-height:0}
.frac{display:inline-flex;flex-direction:column;align-items:center;margin:0 .25rem}
.frac>span:first-child{border-bottom:1.5px solid currentColor;padding:0 .3em .1em}
.frac>span:last-child{padding-top:.1em}

.controls{display:grid;grid-template-columns:1fr 1fr;gap:.9rem 1rem;margin:1.6rem 0 .9rem}
@media (min-width:720px){.controls{grid-template-columns:2fr 2fr 1fr 1fr}}
label{display:block;font-weight:600;font-size:.92rem;margin-bottom:.3rem}
label small{font-weight:400;color:var(--muted)}
input{
  width:100%;direction:ltr;text-align:left;
  font:1.05rem/1.4 var(--serif);color:var(--ink);
  background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:.55rem .7rem;
}
button{
  font:600 1rem var(--sans);background:var(--accent);color:var(--accent-ink);
  border:0;border-radius:6px;padding:.6rem 1.6rem;cursor:pointer;
}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#err{color:var(--accent);min-height:1.7em;margin:.5rem 0 0;font-weight:600}

.plot{margin:.6rem 0 1.2rem;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.plot svg{display:block;direction:ltr;max-width:100%}
.axis{stroke:var(--ink);stroke-width:1.4;fill:none}
.arrow{fill:var(--ink)}
.curve{stroke:var(--ink);stroke-width:2.4;fill:none}
.drop{stroke:var(--muted);stroke-width:1.3;stroke-dasharray:5 4}
.tan{stroke:var(--accent);stroke-width:1.7}
.pt{fill:var(--accent)}
.lbl{font:italic 15px var(--serif);fill:var(--ink)}
.cap{font:15px var(--serif);fill:var(--muted)}

.tablewrap{overflow-x:auto;direction:ltr}
table{width:100%;border-collapse:collapse;font:1.02rem var(--serif);font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:.55rem .9rem;border-bottom:1px solid var(--rule);white-space:nowrap}
th{border-bottom:1.5px solid var(--ink);font-style:italic;font-weight:400}
th sub,td sub{font-size:.65em;line-height:0}
th small{font-size:.8em;color:var(--muted)}
td small{display:block;font-size:.8rem;color:var(--muted)}
tbody tr:last-child td:last-child b{color:var(--accent)}
.result{margin:1.1rem 0 .2rem;font-weight:600}
.result .m{font:italic 1.15rem var(--serif)}
.result sub{font-size:.65em;line-height:0}
#note{color:var(--muted);margin:0}
</style>
</head>
<body>
<main>
  <h1>طريقة نيوتن–رافسون <span class="en">The Newton-Raphson Method</span></h1>
  <p class="lead">أدخل القيمة الابتدائية x₀ والكود يعوّضها في القانون ليحصل على x₁، ثم يعوّض x₁ ليحصل على x₂، وهكذا حتى يقترب من الجذر.</p>

  <div class="formula" aria-label="x(i+1) = x(i) − f(x(i)) / f′(x(i))">
    <span>x<sub>i+1</sub> = x<sub>i</sub> −</span>
    <span class="frac"><span>f(x<sub>i</sub>)</span><span>f′(x<sub>i</sub>)</span></span>
    <span>,&nbsp; i = 0, 1, 2, …</span>
  </div>

  <div class="controls">
    <div><label for="f">المعادلة f(x)</label><input id="f" value="x^2 - 4" autocomplete="off" spellcheck="false"></div>
    <div><label for="df">المشتقة f′(x) <small>(اختيارية)</small></label><input id="df" value="2*x" autocomplete="off" spellcheck="false"></div>
    <div><label for="x0">القيمة x₀</label><input id="x0" value="4" inputmode="decimal" autocomplete="off"></div>
    <div><label for="n">عدد التكرارات</label><input id="n" value="3" type="number" min="1" max="20"></div>
  </div>
  <button id="go" type="button">احسب</button>
  <p id="err" role="alert"></p>

  <div class="plot" id="plot"></div>

  <div class="tablewrap">
    <table>
      <thead><tr>
        <th>i</th><th>x<sub>i</sub></th><th>f(x<sub>i</sub>)</th><th>f′(x<sub>i</sub>)</th>
        <th>x<sub>i+1</sub> <small>= x<sub>i</sub> − f / f′</small></th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <p class="result" id="res"></p>
  <p id="note"></p>
</main>

<script>
/* ---------- قراءة المعادلة (بدون eval) ---------- */
function compile(src){
  const s = src.toLowerCase().replace(/\s+/g,'').replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/,/g,'.');
  let i = 0;
  const FN = {sqrt:Math.sqrt, sin:Math.sin, cos:Math.cos, tan:Math.tan, exp:Math.exp, abs:Math.abs, log:Math.log10, ln:Math.log};
  const NAMES = ['sqrt','sin','cos','tan','exp','abs','log','ln','pi','x','e'];
  const bad = () => { throw new Error('bad'); };
  function expr(){
    let a = term();
    while(s[i]==='+' || s[i]==='-'){
      const op = s[i++], l = a, r = term();
      a = op==='+' ? x=>l(x)+r(x) : x=>l(x)-r(x);
    }
    return a;
  }
  function term(){
    let a = unary();
    for(;;){
      const c = s[i];
      if(c==='*' || c==='/'){
        i++; const l = a, r = unary();
        a = c==='*' ? x=>l(x)*r(x) : x=>l(x)/r(x);
      } else if(c && /[a-z(]/.test(c)){
        const l = a, r = unary(); a = x=>l(x)*r(x);
      } else break;
    }
    return a;
  }
  function unary(){
    if(s[i]==='-'){ i++; const a = unary(); return x=>-a(x); }
    if(s[i]==='+'){ i++; return unary(); }
    return power();
  }
  function power(){
    const b = primary();
    if(s[i]==='^'){ i++; const e = unary(); return x=>Math.pow(b(x), e(x)); }
    return b;
  }
  function primary(){
    const rest = s.slice(i);
    const m = /^(\d+\.?\d*|\.\d+)(e[+-]?\d+)?/.exec(rest);
    if(m){ i += m[0].length; const v = parseFloat(m[0]); return ()=>v; }
    if(s[i]==='('){ i++; const a = expr(); if(s[i++]!==')') bad(); return a; }
    const name = NAMES.find(n => rest.startsWith(n));
    if(!name) bad();
    i += name.length;
    if(FN[name]){
      if(s[i++]!=='(') bad();
      const a = expr(); if(s[i++]!==')') bad();
      const fn = FN[name]; return x=>fn(a(x));
    }
    if(name==='x') return x=>x;
    const c = name==='pi' ? Math.PI : Math.E; return ()=>c;
  }
  const f = expr();
  if(i < s.length) bad();
  return f;
}

/* ---------- أدوات صغيرة ---------- */
const $ = id => document.getElementById(id);
const F=$('f'), D=$('df'), X0=$('x0'), N=$('n'), ERR=$('err'), BOX=$('plot'), TB=$('rows'), RES=$('res'), NOTE=$('note');
const fmt = v => {
  if(!isFinite(v)) return '—';
  const a = Math.abs(v);
  return (a!==0 && (a<1e-6 || a>=1e9)) ? v.toExponential(4) : String(+v.toFixed(8));
};
const p = v => v<0 ? '(' + fmt(v) + ')' : fmt(v);
const lbl = (a,i,b) => a + '<tspan dy="4" font-size="11">' + i + '</tspan><tspan dy="-4">' + b + '</tspan>';
let last = null;

/* ---------- الحساب: x(i+1) = x(i) − f(x(i)) / f′(x(i)) ---------- */
function fail(msg){
  ERR.textContent = msg; last = null;
  TB.innerHTML = ''; RES.textContent = ''; NOTE.textContent = ''; draw();
}
function run(){
  ERR.textContent = '';
  let f, df;
  try{ f = compile(F.value); }
  catch(e){ return fail('تعذّر قراءة f(x). أمثلة: x^2 - 4  أو  exp(x) - 3  أو  cos(x) - x'); }
  if(D.value.trim()){
    try{ df = compile(D.value); }
    catch(e){ return fail('تعذّر قراءة f′(x). اتركها فارغة ليحسبها الكود تلقائيًا.'); }
  } else {
    df = x => { const h = 1e-6*Math.max(1,Math.abs(x)); return (f(x+h)-f(x-h))/(2*h); };
  }
  if(X0.value.trim()==='') return fail('اكتب قيمة x₀.');
  let x = Number(X0.value.replace(',','.'));
  if(!isFinite(x)) return fail('قيمة x₀ لازم تكون رقمًا.');
  const n = Math.min(20, Math.max(1, Math.floor(Number(N.value)) || 1));

  const rows = [], xs = [x]; let note = '';
  for(let i=0; i<n; i++){
    const fx = f(x), dfx = df(x);
    if(!isFinite(fx) || !isFinite(dfx)){ note = 'الدالة غير معرّفة عند x' + i + ' — تم إيقاف التكرار.'; break; }
    if(dfx===0){ note = 'المشتقة = 0 عند x' + i + ' — لا يمكن القسمة، تم إيقاف التكرار.'; break; }
    const xn = x - fx/dfx;
    if(!isFinite(xn)){ note = 'القيمة خرجت عن الحدود — تم إيقاف التكرار.'; break; }
    rows.push({x, fx, dfx, xn}); xs.push(xn);
    const done = Math.abs(xn-x) < 1e-12*Math.max(1,Math.abs(xn));
    x = xn;
    if(done){ if(i<n-1) note = 'الحل استقر، لا حاجة لباقي التكرارات.'; break; }
  }
  if(!rows.length) return fail(note || 'لا يمكن الحساب بهذه القيم.');

  last = {f, rows, xs};
  TB.innerHTML = rows.map((r,i) =>
    '<tr><td>' + i + '</td><td>' + fmt(r.x) + '</td><td>' + fmt(r.fx) + '</td><td>' + fmt(r.dfx) + '</td>' +
    '<td><b>' + fmt(r.xn) + '</b><small>' + fmt(r.x) + ' − ' + p(r.fx) + ' / ' + p(r.dfx) + '</small></td></tr>').join('');
  RES.innerHTML = 'الجذر التقريبي: <bdi dir="ltr" class="m">x<sub>' + rows.length + '</sub> ≈ ' + fmt(rows[rows.length-1].xn) + '</bdi>';
  NOTE.textContent = note;
  draw();
}

/* ---------- الرسم (مثل الشريحة) ---------- */
function draw(){
  if(!last){ BOX.innerHTML = ''; return; }
  const {f, rows, xs} = last;
  const W = Math.max(300, BOX.clientWidth), H = W < 520 ? 300 : 400;
  const L = 40, R = 22, T = 24, B = 62, pw = W-L-R, ph = H-T-B;
  const lo = Math.min(...xs), hi = Math.max(...xs), span = (hi-lo) || 1;
  const xmin = lo - span*0.18, xmax = hi + span*0.14;
  const fv = rows.map(r=>r.fx).concat(0);
  let ymax = Math.max(...fv), ymin = Math.min(...fv); const yr = (ymax-ymin) || 1;
  ymax += yr*0.12; ymin -= yr*0.14;
  const sx = x => L + (x-xmin)/(xmax-xmin)*pw;
  const sy = y => T + (ymax-y)/(ymax-ymin)*ph;
  const y0 = sy(0), ax = (xmin<=0 && xmax>=0) ? sx(0) : L;

  let s = '<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" role="img" aria-label="رسم توضيحي لطريقة نيوتن–رافسون">' +
    '<defs><clipPath id="clip"><rect x="'+L+'" y="'+T+'" width="'+pw+'" height="'+ph+'"/></clipPath>' +
    '<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="arrow"/></marker></defs>' +
    '<line class="axis" x1="'+L+'" y1="'+y0+'" x2="'+(W-R+10)+'" y2="'+y0+'" marker-end="url(#ah)"/>' +
    '<line class="axis" x1="'+ax+'" y1="'+(T+ph)+'" x2="'+ax+'" y2="'+(T-8)+'" marker-end="url(#ah)"/>' +
    '<text class="lbl" x="'+(W-6)+'" y="'+(y0-8)+'" text-anchor="end">x</text>' +
    '<text class="lbl" x="'+(ax+8)+'" y="'+(T-4)+'">y</text>';

  let d = '', pen = false;
  for(let k=0; k<=300; k++){
    const x = xmin + (xmax-xmin)*k/300, y = f(x);
    if(isFinite(y)){ d += (pen?'L':'M') + sx(x).toFixed(1) + ' ' + sy(y).toFixed(1); pen = true; } else pen = false;
  }
  s += '<g clip-path="url(#clip)"><path class="curve" d="'+d+'"/>';
  rows.forEach(r => {
    s += '<line class="drop" x1="'+sx(r.x)+'" y1="'+y0+'" x2="'+sx(r.x)+'" y2="'+sy(r.fx)+'"/>' +
         '<line class="tan" x1="'+sx(r.x)+'" y1="'+sy(r.fx)+'" x2="'+sx(r.xn)+'" y2="'+y0+'"/>';
  });
  s += '</g>';

  rows.forEach((r,i) => {
    const px = sx(r.x), py = sy(r.fx);
    s += '<circle class="pt" cx="'+px+'" cy="'+py+'" r="3.5"/>';
    if(y0-py > 18) s += '<text class="lbl" x="'+(px+7)+'" y="'+(py-6)+'">'+lbl('f(x',i,')')+'</text>';
  });

  let prev = null, lvl = 0;
  xs.forEach((x,i) => {
    const px = sx(x);
    lvl = (prev!==null && Math.abs(px-prev) < 30) ? (lvl+1)%3 : 0; prev = px;
    s += '<text class="lbl" text-anchor="middle" x="'+px+'" y="'+(y0+18+lvl*17)+'">'+lbl('x',i,'')+'</text>';
  });

  const r0 = rows[0];
  s += '<text class="lbl" x="'+((sx(r0.x)+sx(r0.xn))/2+10)+'" y="'+(((sy(r0.fx)+y0)/2)+18)+'">Slope: '+lbl('f′(x',0,')')+'</text>';
  s += '<text class="cap" text-anchor="end" x="'+(sx(xs[xs.length-1])-8)+'" y="'+(y0-10)+'">Solution</text>';
  BOX.innerHTML = s + '</svg>';
}

$('go').addEventListener('click', run);
[F, D, X0, N].forEach(el => el.addEventListener('input', run));
if('ResizeObserver' in window) new ResizeObserver(draw).observe(BOX); else window.addEventListener('resize', draw);
run();
</script>
</body>
</html>
